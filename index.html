<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spacetime Slicer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Stack a video's frames into a cube of points, then slice it along XY, XZ or ZY.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500;600&family=Unbounded:wght@600&display=swap">
<style>
:root {
  /* Layout: two framed viewports side by side, the block (3D point cloud with plane handles) and the cut (points on the active plane), under one slim header. Dark by design: the points are the light. */
  --ink: #07080d;
  --panel: #0c0e15;
  --raise: #161a27;
  --line: #232a3b;
  --line-strong: #3a435c;
  --text: #e8eaf2;
  --muted: #8d93a9;
  --x: #ff5c7a;
  --y: #45dc9c;
  --z: #5bb6ff;
  --warn: #ff9b7a;
  --sheet: #5bb6ff;  /* the sheet's colour, blended from the axis colours by the way it faces; set by the script */
  --font-display: "Unbounded", "Instrument Sans", system-ui, sans-serif;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--z); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 14px;
  padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* header */
.bar { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 22px; min-height: 40px; }
.brand { margin: 0; display: flex; align-items: center; gap: 10px; font: 600 15px/1 var(--font-display); letter-spacing: 0.01em; white-space: nowrap; }
.mark { display: inline-grid; grid-template-columns: repeat(3, 6px); gap: 3px; }
.mark i { width: 6px; height: 6px; border-radius: 50%; }
.mark i:nth-child(1) { background: var(--x); }
.mark i:nth-child(2) { background: var(--y); }
.mark i:nth-child(3) { background: var(--z); }
.status { flex: 1 1 280px; min-width: 0; margin: 0; color: var(--muted); font: 400 12px/1.4 var(--font-data); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.error { color: var(--warn); white-space: normal; }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.btn {
  appearance: none; cursor: pointer;
  padding: 9px 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--raise); color: var(--text);
  font: 500 13px/1 var(--font-ui);
}
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--text); border-color: var(--text); color: var(--ink); }
.btn.primary:hover { background: var(--muted); border-color: var(--muted); }
.btn.quiet { background: transparent; }
.detail { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.detail select {
  appearance: none; cursor: pointer;
  padding: 8px 28px 8px 11px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--raise) no-repeat right 10px center / 8px 5px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(-45deg, transparent 50%, var(--muted) 50%);
  background-size: 4px 4px, 4px 4px;
  background-position: right 14px center, right 10px center;
  color: var(--text); font: 500 13px/1 var(--font-ui);
}
.progress { position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; }
.progress i { display: block; width: 0; height: 100%; background: linear-gradient(90deg, var(--x), var(--y), var(--z)); }

/* the two viewports */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
.panel { position: relative; display: grid; min-width: 0; min-height: 0; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.block { grid-template-rows: minmax(0, 1fr) auto; }
.cut { grid-template-rows: auto minmax(0, 1fr) auto auto; }
.viewport, .view { position: relative; min-height: 0; }
canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.corner { position: absolute; top: 12px; left: 14px; right: 14px; display: grid; gap: 4px; margin: 0; pointer-events: none; color: var(--muted); }
.meta { font: 400 11px/1.4 var(--font-data); }
.hint { font-size: 12px; opacity: 0.8; }
.axis-labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.sampler { position: absolute; top: 12px; right: 12px; z-index: 1; width: 112px; height: 112px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: var(--ink); pointer-events: none; }
.axis-label { position: absolute; left: 0; top: 0; color: var(--c); font: 500 11px/1 var(--font-data); white-space: nowrap; text-shadow: 0 0 6px var(--panel), 0 0 2px var(--panel); }

/* the sheet's controls under the block */
.hud { --c: var(--sheet); display: grid; gap: 8px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
.hud-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.presets button { padding: 8px 14px; font: 600 13px/1 var(--font-data); letter-spacing: 0.02em; }
.presets button[aria-pressed="true"] { color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--raise)); }
.params { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 22px; }
.param { display: grid; grid-template-columns: 78px minmax(0, 1fr) 64px; align-items: center; gap: 10px; padding: 3px 4px; }
.param.wide { grid-template-columns: 78px minmax(0, 1fr) 150px; }
.param label { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 12.5px; white-space: nowrap; cursor: pointer; }
.param label b { width: 12px; color: var(--text); font: 600 14px/1 var(--font-data); }
.param output { text-align: right; font: 400 12px/1 var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.num { display: flex; align-items: center; gap: 3px; color: var(--muted); font: 400 12px/1 var(--font-data); }
.num input {
  width: 100%; min-width: 0; padding: 6px 7px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--ink); color: var(--text); font: 400 12px/1 var(--font-data); text-align: right; -moz-appearance: textfield;
}
.num input::-webkit-inner-spin-button, .num input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.opts { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; padding-inline: 4px; }
.size { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; white-space: nowrap; --c: var(--muted); }
.size input { width: 120px; }

input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 4px;
  background: linear-gradient(90deg, var(--c) var(--fill, 0%), var(--line) var(--fill, 0%));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%;
  background: var(--c); border: 2px solid var(--text); box-shadow: 0 0 0 3px var(--panel);
}
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--c); }
input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--c); border: 2px solid var(--text); }

.seg { display: inline-flex; padding: 2px; border-radius: 9px; border: 1px solid var(--line); background: var(--ink); }
.seg button { appearance: none; cursor: pointer; padding: 7px 11px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: 500 12.5px/1 var(--font-ui); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); }

/* what the sheet touches */
.cut-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.cut-head h2 { margin: 0; font: 600 13.5px/1.2 var(--font-data); }
.swatch { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--sheet); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sheet) 25%, transparent); }
#slice { cursor: ew-resize; }
.edge-label { position: absolute; left: 0; top: 0; color: var(--c, var(--muted)); font: 400 11px/1 var(--font-data); white-space: nowrap; pointer-events: none; }
.transport { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 10px 12px; border-top: 1px solid var(--line); }
.play { appearance: none; cursor: pointer; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--text); color: var(--ink); }
.play:hover { background: var(--muted); }
.readout { margin-left: auto; font: 400 12.5px/1 var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.explain { margin: 0; padding: 0 16px 14px; max-width: 64ch; color: var(--muted); font-size: 13px; }

.drop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; pointer-events: none; background: color-mix(in srgb, var(--ink) 80%, transparent); }
.drop p { margin: 0; padding: 30px 44px; border: 1.5px dashed var(--muted); border-radius: 16px; font: 600 16px/1.3 var(--font-display); }

@media (max-width: 880px) {
  .app { height: auto; min-height: 100%; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .block { grid-template-rows: auto auto; }
  .viewport { width: 100%; aspect-ratio: 1; max-width: 100%; }
  .hint { display: none; }
  .cut { grid-template-rows: auto auto auto auto; }
  .view { width: 100%; aspect-ratio: 1; max-width: 100%; }
}
@media (max-width: 1180px) {
  .params { grid-template-columns: minmax(0, 1fr); }
  .param.wide { grid-template-columns: 78px minmax(0, 1fr) 64px; }
  .param.wide output { white-space: normal; font-size: 11px; line-height: 1.3; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Spacetime Slicer</h1>
    <p class="status" id="status" role="status">Building the demo clip…</p>
    <div class="actions">
      <button class="btn primary" id="resume" type="button" hidden>Start sampling</button>
      <button class="btn primary" id="open" type="button">Open video</button>
      <input id="file" type="file" accept="video/*" hidden>
      <button class="btn" id="demo" type="button">Demo clip</button>
      <label class="detail" for="quality">Detail
        <select id="quality">
          <option value="fast">Fast</option>
          <option value="balanced" selected>Balanced</option>
          <option value="detailed">Detailed</option>
        </select>
      </label>
    </div>
    <div class="progress" id="progress" hidden><i id="bar"></i></div>
  </header>

  <main class="stage">
    <section class="panel block" aria-label="Point cloud of the video">
      <div class="viewport">
        <canvas id="cube" aria-label="3D point cloud of the video with the slicing sheet. Drag to orbit, scroll to zoom, drag the sheet's handle to push it through."></canvas>
        <div class="axis-labels" aria-hidden="true">
          <span class="axis-label" style="--c: var(--x)">x · column</span>
          <span class="axis-label" style="--c: var(--y)">y · row</span>
          <span class="axis-label" style="--c: var(--z)">z · time</span>
        </div>
        <div class="corner">
          <p class="meta" id="meta"></p>
          <p class="hint">Drag to orbit · scroll to zoom · drag the sheet's handle to push it through</p>
        </div>
      </div>
      <div class="hud">
        <div class="hud-row">
          <div class="seg presets" role="group" aria-label="Sheet presets">
            <button type="button" data-preset="xy" aria-pressed="true" style="--c: var(--z)" title="Square to time: a single frame (key 1)">XY</button>
            <button type="button" data-preset="xz" aria-pressed="false" style="--c: var(--y)" title="Square to rows: one row over time (key 2)">XZ</button>
            <button type="button" data-preset="zy" aria-pressed="false" style="--c: var(--x)" title="Square to columns: one column over time (key 3)">ZY</button>
          </div>
          <div class="seg" role="group" aria-label="Block display">
            <button type="button" id="mode-ghost" aria-pressed="true" title="Show the whole block as a faint haze around the sheet">Ghost</button>
            <button type="button" id="mode-cut" aria-pressed="false" title="Hide the part of the block between you and the sheet">Cut</button>
          </div>
        </div>
        <div class="param wide">
          <label for="depth"><b>d</b>depth</label>
          <input type="range" id="depth" min="0" max="1" step="0.001" value="0">
          <output id="depth-out" for="depth"></output>
        </div>
        <div class="params">
          <div class="param">
            <label for="omega" title="Omega: rotation about the x axis"><b>ω</b>about x</label>
            <input type="range" id="omega" min="-180" max="180" step="1" value="0">
            <span class="num"><input type="number" id="omega-num" min="-180" max="180" step="1" value="0" aria-label="Omega, rotation about x, in degrees">°</span>
          </div>
          <div class="param">
            <label for="phi" title="Phi: rotation about the y axis"><b>φ</b>about y</label>
            <input type="range" id="phi" min="-180" max="180" step="1" value="0">
            <span class="num"><input type="number" id="phi-num" min="-180" max="180" step="1" value="0" aria-label="Phi, rotation about y, in degrees">°</span>
          </div>
          <div class="param">
            <label for="kappa" title="Kappa: rotation about the z (time) axis"><b>κ</b>about z</label>
            <input type="range" id="kappa" min="-180" max="180" step="1" value="0">
            <span class="num"><input type="number" id="kappa-num" min="-180" max="180" step="1" value="0" aria-label="Kappa, rotation about z (time), in degrees">°</span>
          </div>
          <div class="param">
            <label for="sphere" title="0 keeps the sheet flat; 1 bends it all the way into a closed sphere"><b>s</b>sphere</label>
            <input type="range" id="sphere" min="0" max="1" step="0.01" value="0">
            <span class="num"><input type="number" id="sphere-num" min="0" max="1" step="0.01" value="0" aria-label="Sphereness, from 0 (flat) to 1 (closed sphere)"></span>
          </div>
        </div>
        <div class="opts">
          <label class="size" for="size">Point size <input type="range" id="size" min="0.35" max="1.8" step="0.05" value="1"></label>
          <button type="button" class="btn quiet" id="reset">Reset view</button>
        </div>
      </div>
    </section>

    <section class="panel cut" aria-label="What the sheet touches">
      <div class="cut-head">
        <span class="swatch" aria-hidden="true"></span>
        <h2 id="sheet-name">XY · a frame</h2>
      </div>
      <div class="view">
        <canvas id="slice" aria-label="The points the sheet touches, laid out flat. Drag sideways or scroll to push the sheet through the block."></canvas>
        <span class="edge-label" id="label-u"></span>
        <span class="edge-label" id="label-v"></span>
      </div>
      <div class="transport">
        <button type="button" class="play" id="play" aria-label="Play"></button>
        <div class="seg" role="group" aria-label="Speed">
          <button type="button" data-speed="0.25" aria-pressed="false">¼×</button>
          <button type="button" data-speed="0.5" aria-pressed="false">½×</button>
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="2" aria-pressed="false">2×</button>
          <button type="button" data-speed="4" aria-pressed="false">4×</button>
        </div>
        <output class="readout" id="readout"></output>
      </div>
      <p class="explain" id="explain"></p>
    </section>
  </main>
</div>
<div class="drop" id="drop" hidden><p>Drop the video to slice it</p></div>
<script src="app.js"></script>
</body>
</html>
